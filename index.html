<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ask Before Buy 100%</title>
<style>
body{background:#020617;color:#fff;font-family:system-ui;padding:16px;margin:0}
h2{text-align:center}
button{background:#22c55e;color:#000;border:none;padding:16px;width:100%;border-radius:14px;font-weight:900;font-size:18px}
input{width:100%;padding:16px;border-radius:14px;border:none;margin:12px 0;box-sizing:border-box;font-size:18px;text-align:center}
.card{background:#1e293b;border-radius:16px;padding:16px;margin-top:14px;border:1px solid #334155}
.kcal{font-size:34px;font-weight:900;color:#22c55e}
#reader{width:100%;margin-top:12px;border-radius:16px;overflow:hidden;display:none}
</style>
</head>
<body>
<h2>🌍 اسأل قبل ما تشتري - 100%</h2>
<button onclick="startScan()">📷 امسح اي باركود من اي دولة</button>
<div id="reader"></div>
<input id="codeInput" value="6224009210817" placeholder="اكتب الباركود">
<div id="result"></div>
<script src="https://unpkg.com/html5-qrcode@2.3.10/html5-qrcode.min.js"></script>
<script>
const DB = {
 "6224009210817": {name:"جبنة رودس شيدر طبيعي 100% - 250جم", kcal:312, fat:24, sugar:2, salt:2.1, info:"طبيعية 100% - المعلقة 12 سعرة فقط - المنتج رقم 1 في كفرة نصار"}
};
function render(code){
  const p = DB[code];
  const box = document.getElementById('result');
  if(!p){box.innerHTML='<div class=card>🔍 غير مسجل</div>';return;}
  box.innerHTML='<div class=card><h3>'+p.name+'</h3><div class=kcal>'+p.kcal+' سعرة / 100جم</div><div>🧈 '+p.fat+'g 🍬 '+p.sugar+'g 🧂 '+p.salt+'g</div><div style=background:#020617;padding:10px;border-radius:10px;margin-top:10px>💡 '+p.info+'</div></div>';
}
function handle(code){
  code=(code+'').replace(/[^0-9]/g,'').trim();
  if(code.length<7)return;
  document.getElementById('codeInput').value=code;
  render(code);
}
let scanner;
function startScan(){
  const r=document.getElementById('reader');
  r.style.display='block';
  scanner=new Html5Qrcode('reader');
  scanner.start({facingMode:'environment'},{fps:10,qrbox:250},(txt)=>{handle(txt);scanner.stop().then(()=>{r.style.display='none'});});
}
document.getElementById('codeInput').addEventListener('input',(e)=>handle(e.target.value));
window.addEventListener('load',()=>{handle('6224009210817');});
</script>
</body>
</html>
