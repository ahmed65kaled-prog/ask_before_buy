<!DOCTYPE html><html lang=ar dir=rtl><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>اسأل قبل ما تشتري - 100% مصري</title>
<link rel=icon href=icon-192.png><link rel=apple-touch-icon href=icon-512.png>
<link rel=manifest href=manifest.webmanifest><meta name=theme-color content="#020617">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{background:#020617;color:#fff;font-family:system-ui;padding:14px;margin:0}
h1{text-align:center;font-size:26px;margin:10px;background:linear-gradient(90deg,#22c55e,#86efac);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.btn{background:linear-gradient(90deg,#22c55e,#16a34a);color:#000;padding:14px;border-radius:16px;border:0;font-weight:800;width:100%;font-size:18px;box-shadow:0 8px 24px rgba(34,197,94,.35)}
input{width:100%;padding:14px;border-radius:14px;border:1px solid #1e293b;background:#0f172a;color:#fff;margin:12px 0}
.card{background:linear-gradient(180deg,#1e293b,#0f172a);padding:16px;border-radius:18px;margin-top:12px;border:1px solid #1e293b;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.badge{padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700}
.badge-eg{background:#22c55e;color:#000}.badge-other{background:#ef4444;color:#fff}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.kv div{background:#0f172a;padding:10px;border-radius:12px;border:1px solid #1e293b;text-align:center}
#scanner{position:fixed;inset:0;background:#000;z-index:999;display:none;flex-direction:column}
#reader{width:100%;height:65vh}.filters button{background:#0f172a;color:#cbd5e1;border:1px solid #1e293b;padding:8px 16px;border-radius:999px;margin:3px}.filters button.active{background:#22c55e;color:#000;font-weight:700}
</style></head><body>
<h1>🌍 اسأل قبل ما تشتري - 100%</h1>
<button class=btn onclick="startScan()">📷 امسح اي باركود من اي دولة</button>
<div id=scanner><div id=reader></div><div style="padding:16px;text-align:center"><p style="color:#22c55e">حط الباركود جوه المربع</p><p id=scanResult style="color:#86efac"></p><button onclick="stopScan()" style="background:#1e293b;color:#fff;border:1px solid #334155;padding:10px 20px;border-radius:999px">✕ إغلاق</button></div></div>
<input id=search placeholder="مثال 6224009210817" oninput="doSearch(this.value)">
<div class=filters><button onclick="doFilter('الكل')" id=bf-الكل class=active>الكل</button><button onclick="doFilter('ألبان')">ألبان</button><button onclick="doFilter('معلبات')">معلبات</button></div>
<div id=count style="color:#22c55e;margin-top:8px;font-weight:700"></div>
<div id=list></div>
<script>
const DB=[{n:"تونة صن شاين",b:"Sunshine",p:32,c:"معلبات",code:"6223001234567",k:144,f:0.8,r:23,d:"اوميجا 3 - بروتين"},{n:"فول كاليفورنيا",b:"Cal Garden",p:18,c:"معلبات",code:"6223002345678",k:88,f:0.5,r:5,d:"ألياف"},{n:"لبن جهينة",b:"Juhayna",p:32,c:"ألبان",code:"6223001360056",k:61,f:3.2,r:3,d:"كالسيوم"}];
for(let i=0;i<147;i++){let x=DB[i%3];DB.push({n:x.n+" "+(i+1),b:x.b,p:x.p+(i%5),c:x.c,code:"6223001"+String(360000+i).padStart(6,"0"),k:x.k,f:x.f,r:x.r,d:x.d})}

function countryFromCode(c){if(c.startsWith('622'))return{flag:'🇪🇬',name:'مصر',isEg:true};if(c.startsWith('729'))return{flag:'🇮🇱',name:'اسرائيل',isEg:false};if(c.startsWith('890'))return{flag:'🇮🇳',name:'الهند',isEg:false};return{flag:'🌍',name:'مستورد',isEg:false}}

function renderCard(p,ext=null){
  let co=countryFromCode(p.code||'');
  let brand=ext?.brands||p.b||'غير معروف';
  let prod=ext?.product_name_ar||ext?.product_name||p.n||'منتج غير مسجل';
  let cal=ext?.nutriments?.['energy-kcal_100g']||p.k||'?';
  let fat=ext?.nutriments?.fat_100g||p.f||'?';
  let prot=ext?.nutriments?.proteins_100g||p.r||'?';
  return `<div class=card>
  <div><span class="badge ${co.isEg?'badge-eg':'badge-other'}">${co.flag} ${co.name} - ${p.code}</span> <span class=badge style="background:#0f172a;border:1px solid #1e293b;margin-right:6px">${brand}</span></div>
  <h2 style="margin:12px 0">${prod} - <span style="color:#22c55e">${p.p? p.p+'ج' : ''}</span></h2>
  <div style="color:#94a3b8">العلامة التجارية: <b style="color:#fff">${brand}</b> | التصنيف: ${p.c||'عام'}</div>
  <div class=kv><div>🔥 ${cal}<br><small>سعرة /100ج</small></div><div>🥑 ${fat}g<br><small>دهون</small></div><div>💪 ${prot}g<br><small>بروتين</small></div><div>🏷️ ${co.isEg?'✅ مصري 622':'⚠️ مستورد'}</div></div>
  <div style="margin-top:12px;background:#0f172a;padding:10px;border-radius:12px;border:1px dashed #22c55e">💡 القيمة الغذائية: ${p.d||ext?.ingredients_text_ar||ext?.ingredients_text||'لا توجد بيانات محلية - جاري جلبها'}</div>
  ${ext?.image_url?`<img src="${ext.image_url}" style="width:100%;border-radius:12px;margin-top:10px;max-height:200px;object-fit:contain;background:#fff">`:''}
  </div>`
}

function render(a){if(a.length==0){list.innerHTML='';return}list.innerHTML=a.map(p=>renderCard(p)).join('');count.innerText=`✅ عرض ${a.length} منتج مصري 622`}

async function doSearch(q){
  if(!q){render(DB);count.innerText=`✅ عرض ${DB.length} منتج مصري 622`;return}
  q=q.trim();let co=countryFromCode(q);
  let found=DB.filter(x=>(x.n+x.b+x.code).toLowerCase().includes(q.toLowerCase()));
  if(found.length>0){render(found);return}
  // لو مش موجود - نجيب من Open Food Facts + نطلع تقرير
  count.innerText=`🔍 ببحث عن ${q} ...`;
  list.innerHTML=renderCard({code:q,c:'غير مسجل',p:''},{product_name_ar:'جاري البحث عن '+q, brands:'غير معروف'});
  try{
    let r=await fetch(`https://world.openfoodfacts.org/api/v0/product/${q}.json`);
    let j=await r.json();
    if(j.status==1 && j.product){
      list.innerHTML=renderCard({code:q,c:j.product.categories||'مستورد',p:''},j.product);
      count.innerHTML=`${co.flag} ${co.name} ${co.isEg?'✅ مصري 622':'⚠️'} - ${j.product.product_name||'منتج مستورد'}<br>العلامة: ${j.product.brands||'غير معروف'}`;
    }else{
      list.innerHTML=renderCard({code:q,c:'غير مسجل في القاعدة المحلية',p:'',n:'منتج برقم '+q,b:'سيتم اضافته قريبا',k:'?',f:'?',r:'?',d:'المنتج مصري 622 لكنه جديد - ساعدنا بإضافة اسمه وصورته'},null);
      count.innerText=`${co.flag} ${co.name} - ${q} - غير موجود محليا لكن باركود ${co.isEg?'مصري ✅':'مستورد'}`;
    }
  }catch(e){
    list.innerHTML=renderCard({code:q,c:'غير مسجل',p:'',n:'منتج '+q,b:'غير معروف',k:'?',f:'?',r:'?',d:'لا يوجد اتصال لجلب البيانات - باركود '+(co.isEg?'مصري 622 ✅':'مستورد')},null);
    count.innerText=`${co.flag} باركود ${q} - ${co.name}`;
  }
}
function doFilter(q){if(q=='الكل')render(DB);else render(DB.filter(x=>x.c.includes(q)))}
render(DB);
let html5Qrcode=null;
async function startScan(){document.getElementById('scanner').style.display='flex';html5Qrcode=new Html5Qrcode("reader");await html5Qrcode.start({facingMode:"environment"},{fps:10,qrbox:{width:250,height:120}},(d)=>{document.getElementById('scanResult').innerText="✅ تم: "+d;stopScan();search.value=d;doSearch(d);},()=>{});}
async function stopScan(){if(html5Qrcode){try{await html5Qrcode.stop();}catch{}html5Qrcode=null}document.getElementById('scanner').style.display='none'}
</script></body></html>
