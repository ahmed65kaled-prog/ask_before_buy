<!DOCTYPE html><html lang=ar dir=rtl><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>اسأل قبل ما تشتري - 100% مصري</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>body{background:#020617;color:#fff;font-family:system-ui;padding:14px}.card{background:#1e293b;padding:16px;border-radius:18px;margin-top:12px;border:2px solid #22c55e}.badge{padding:6px 12px;border-radius:20px;font-weight:700}.b1{background:#22c55e;color:#000}.b2{background:#0f172a;color:#86efac;border:1px solid #1e293b}.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.kv div{background:#0f172a;padding:10px;border-radius:12px;text-align:center} #scanner{position:fixed;inset:0;background:#000;z-index:999;display:none;flex-direction:column} #reader{width:100%;height:70vh}.btn{background:linear-gradient(90deg,#22c55e,#16a34a);color:#000;padding:14px;border-radius:16px;border:0;width:100%;font-weight:800;font-size:18px}</style></head><body>
<h1 style="text-align:center;color:#22c55e">🌍 اسأل قبل ما تشتري - 100%</h1>
<button class=btn onclick="startScan()">📷 امسح اي باركود من اي دولة</button>
<div id=scanner><div id=reader></div><div style="text-align:center;padding:16px"><p id=scanResult></p><button onclick="stopScan()" style="padding:10px 20px;border-radius:20px">✕ إغلاق</button></div></div>
<input id=search style="width:100%;padding:14px;border-radius:14px;background:#0f172a;color:#fff;border:1px solid #1e293b;margin:12px 0" placeholder="ابحث برقم الباركود" oninput="showReport(this.value)">
<div id=count style="color:#22c55e;font-weight:700"></div>
<div id=list></div>
<script>
function getInfo(code){
 code=(code||'').replace(/\D/g,''); let p=code.substring(0,3);
 if(p=='622')return{flag:'🇪🇬',country:'مصر - منتج مصري 100%',color:'#22c55e',isEg:true,company:'شركة مسجلة في GS1 Egypt'};
 if(p=='729')return{flag:'🇮🇱',country:'غير مصري',color:'#ef4444',isEg:false,company:''};
 return{flag:'🌍',country:'منتج مستورد - '+p,color:'#f59e0b',isEg:false,company:''};
}
function showReport(code){
 if(!code){list.innerHTML='<div class=card>اكتب او امسح باركود لعرض التقرير</div>';return}
 let info=getInfo(code);
 let DB={'6223001360056':{name:'لبن جهينة كامل الدسم 1 لتر',brand:'جهينة Juhayna',price:'32 جنيه',cat:'ألبان',cal:'61',fat:'3.2g',pro:'3g',desc:'كالسيوم عالي - مصري 100%'}};
 let p=DB[code]||{name:'منتج برقم '+code,brand:'العلامة: قيد البحث (باركود '+code.substring(0,7)+')',price:'السعر: اسأل البائع',cat:'تصنيف: عام',cal:'61',fat:'3.2',pro:'3',desc: info.isEg? 'باركود مصري أصلي 622 - تم تسجيله في مصر - منتج وطني ✅' : 'باركود '+info.flag+' '+info.country};
 list.innerHTML=`<div class=card style="border-color:${info.color}"><div><span class=badge style="background:${info.color};color:#000">${info.flag} ${info.country}</span> <span class="badge b2">${code}</span></div><h2 style="margin:12px 0">${p.name}</h2><p>🏢 <b>العلامة التجارية:</b> ${p.brand}</p><p>🏷️ <b>التصنيف:</b> ${p.cat} | 💰 <b>${p.price}</b></p><div class=kv><div>🔥 ${p.cal}<br><small>سعرة حرارية</small></div><div>🥑 ${p.fat}<br><small>دهون</small></div><div>💪 ${p.pro}<br><small>بروتين</small></div><div style="background:${info.color};color:#000;font-weight:800">${info.flag}<br>${info.isEg?'مصري 622':'مستورد'}</div></div><div style="margin-top:12px;background:#0f172a;padding:12px;border-radius:12px;border:1px dashed ${info.color}">💡 <b>التقرير الغذائي:</b><br>${p.desc}<br><br>📌 الشركة المنتجة: ${info.company}<br>📌 كود الدولة: ${code.substring(0,3)} = ${info.country}</div></div>`;
 count.innerText=`✅ تم تحليل الباركود: ${code}`;
}
let html5Qrcode=null;
async function startScan(){document.getElementById('scanner').style.display='flex';html5Qrcode=new Html5Qrcode("reader");await html5Qrcode.start({facingMode:"environment"},{fps:15,qrbox:{width:280,height:120}},(d)=>{stopScan();document.getElementById('search').value=d;showReport(d);},()=>{});}
async function stopScan(){if(html5Qrcode){try{await html5Qrcode.stop();}catch{}html5Qrcode=null}document.getElementById('scanner').style.display='none'}
showReport('6224009210817');
</script></body></html>
